ns"><button id="fight">⚡ バトル開始</button><button id="skill" disabled>🔥 スキル発動</button><button id="jump" disabled>🪽 ジャンプ（HP -12）</button><button id="retry">最初からやり直す</button></div></div></div><div class="tabpage" id="tab-custom"><div class="panel"><h2>⚙️ カスタマイズ</h2><canvas id="preview" class="preview" width="480" height="340"></canvas><div id="buildstats"></div><div id="customTabs"><button class="selected" data-part="shooter">🔫 シューター</button><button data-part="body">🛡 ボディ</button><button data-part="weapon">⚔️ ウエポン</button></div><div id="partGrid"></div><p class="muted">選択した装備は対戦画面に反映。未購入パーツはショップで購入できます。</p><select id="shooter" hidden></select><select id="body" hidden></select><select id="weapon" hidden></select></div></div>
<div class="tabpage" id="tab-store"><div class="panel"><h2>🪙 PARTS SHOP</h2><p class="muted">勝利報酬でパーツを購入し、強敵に挑もう。</p><div id="shop" class="shop"></div></div></div></div><script>
const parts={shooter:[{id:'s0',name:'ベーシックシューター',hp:80,st:40,cost:0},{id:'s1',name:'ドラゴンシューター',hp:100,st:50,cost:110},{id:'s2',name:'プラチナシューター',hp:84,st:66,cost:170},{id:'s3',name:'イナズマシューター',hp:76,st:74,cost:230},{id:'s4',name:'チェーンシューター',hp:90,st:60,cost:290}],body:[{id:'b0',name:'ベーシックボディ',def:36,skill:'none',cost:0},{id:'b1',name:'ダークボディ',def:40,skill:'blast',cost:130},{id:'b2',name:'メタルボディ',def:46,skill:'shield',cost:220},{id:'b3',name:'アイスボディ',def:43,skill:'heal',cost:280},{id:'b4',name:'マグマボディ',def:42,skill:'rage',cost:350}],weapon:[{id:'w0',name:'ベーシックエフェクト',atk:55,dex:10,cost:0},{id:'w1',name:'ファイヤーエフェクト',atk:70,dex:15,cost:130},{id:'w2',name:'ウッドエフェクト',atk:64,dex:21,cost:180},{id:'w3',name:'ロックエフェクト',atk:66,dex:19,cost:240},{id:'w4',name:'ゴーストエフェクト',atk:60,dex:25,cost:320}]};const skillNames={none:'スキルなし',blast:'相手の最大HP20%ダメージ',heal:'最大HP30%回復',rage:'5秒間攻撃力1.5倍',shield:'5秒間ダメージ無効'};const key='spinbreakers-save-v1';let save;try{save=JSON.parse(localStorage.getItem(key))}catch(e){}save=save||{stage:1,coins:0,owned:['s0','b0','w0'],chosen:{shooter:'s0',body:'b0',weapon:'w0'}};let active=false,p,e,last=0,particles=[],cooldown=0;const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');function persist(){localStorage.setItem(key,JSON.stringify(save))}function get(t){return parts[t].find(x=>x.id===save.chosen[t])}function build(){const s=get('shooter'),b=get('body'),w=get('weapon');return{max:s.hp*3,hp:s.hp*3,st:s.st,def:b.def,atk:w.atk,dex:w.dex,skill:b.skill,visual:{shooter:s.id,body:b.id,weapon:w.id},x:165,y:245,vx:2.8,vy:0,angle:0,spin:0,boost:0,shield:0,charge:0,jump:0,jumpCD:0,r:39,color:'#27ccff'}}function foe(){let n=save.stage;return{max:190+n*30,hp:190+n*30,st:35+n*5,def:31+n*2.2,atk:51+n*2.7,dex:9+n*1.6,visual:{shooter:'s0',body:'b0',weapon:'w0'},x:555,y:245,vx:-2.8-n*.07,vy:0,angle:0,spin:0,boost:0,shield:0,charge:0,jump:0,jumpCD:0,r:39,color:'#ff465e'}}function ui(){ $('stage').textContent='STAGE '+save.stage+' / 10';$('coins').textContent='🪙 '+save.coins;$('ename').textContent='RIVAL '+save.stage;for(const t of Object.keys(parts)){let el=$(t);el.innerHTML=parts[t].filter(x=>save.owned.includes(x.id)).map(x=>`<option value="${x.id}">${x.name}</option>`).join('');el.value=save.chosen[t];el.disabled=active}let z=build();$('buildstats').innerHTML=`<b>HP ${z.max}　攻撃 ${z.atk}　守備 ${z.def}　安定 ${z.st}　器用 ${z.dex}</b><p class="highlight">固有スキル：${skillNames[z.skill]}</p>`;$('shop').innerHTML=Object.keys(parts).flatMap(t=>parts[t].filter(x=>x.cost).map(x=>`<div class="item"><b>${x.name}</b><div class="muted">${t==='shooter'?`HP +${x.hp} / 安定 +${x.st}`:t==='body'?`守備 +${x.def} / ${skillNames[x.skill]}`:`攻撃 +${x.atk} / 器用 +${x.dex}`}</div><button data-id="${x.id}" data-type="${t}" ${active||save.owned.includes(x.id)||save.coins<x.cost?'disabled':''}>${save.owned.includes(x.id)?'購入済み':'🪙 '+x.cost}</button></div>`)).join('');document.querySelectorAll('[data-id]').forEach(btn=>btn.onclick=()=>{let x=parts[btn.dataset.type].find(x=>x.id===btn.dataset.id);if(active||save.coins<x.cost)return;save.coins-=x.cost;save.owned.push(x.id);save.chosen[btn.dataset.type]=x.id;persist();ui()});$('fight').disabled=active;$('skill').disabled=!active||!p||p.skill==='none'||p.charge<100;$('jump').disabled=!active||!p||p.jumpCD>0||p.hp<=13; if(p&&e){$('php').style.width=Math.max(0,p.hp/p.max*100)+'%';$('ehp').style.width=Math.max(0,e.hp/e.max*100)+'%';$('ptxt').textContent=Math.ceil(Math.max(0,p.hp))+' / '+p.max;$('etxt').textContent=Math.ceil(Math.max(0,e.hp))+' / '+e.max}}Object.keys(parts).forEach(t=>$(t).onchange=ev=>{save.chosen[t]=ev.target.value;persist();ui()});function launch(){p=build();e=foe();active=true;cooldown=0;particles=[];$('log').textContent='3、2、1… GO SHOOT!';ui()}$('fight').onclick=launch;$('retry').onclick=()=>{if(!confirm('進行状況と購入パーツを初期化しますか？'))return;localStorage.removeItem(key);location.reload()};$('jump').onclick=()=>{if(!active||p.jumpCD>0||p.hp<=13)return;p.hp-=12;p.jump=.9;p.jumpCD=4;burst(p.x,p.y,'#9feeff');$('log').textContent='🪽 ジャンプ！ 空中で衝突攻撃を回避！';ui()};$('skill').onclick=()=>{if(!active||p.skill==='none'||p.charge<100)return;p.charge=0;if(p.skill==='blast'){e.hp-=e.max*.2;$('log').textContent='🔥 ドラゴンブレイク！ 20%ダメージ！'}if(p.skill==='heal'){p.hp=Math.min(p.max,p.hp+p.max*.3);$('log').textContent='✨ フェニックスヒール！ 30%回復！'}if(p.skill==='rage'){p.boost=5;$('log').textContent='⚡ バーサーク！ 攻撃力1.5倍！'}if(p.skill==='shield'){p.shield=5;$('log').textContent='🛡 イージスバリア！ 5秒間無敵！'}burst(p.x,p.y,'#ffe66d');ui()};function burst(x,y,color){for(let i=0;i<18;i++)particles.push({x,y,vx:(Math.random()-.5)*11,vy:(Math.random()-.5)*11,life:25,color})}function hit(a,b){const crit=Math.random()<Math.min(.5,a.dex*.008);let dmg=Math.max(1,(a.atk*(a.boost>0?1.5:1)*(crit?1.5:1)-b.def*(crit?.5:1))*(.82+Math.random()*.36));if(b.shield>0||b.jump>0)dmg=0;b.hp-=dmg;a.charge=Math.min(100,a.charge+22);if(crit)$('log').textContent='💥 CRITICAL HIT! '+Math.round(dmg)+'ダメージ';burst((a.x+b.x)/2,(a.y+b.y)/2,crit?'#ffe95e':'#a7f4ff')}function finish(win){active=false;if(win){let prize=65+save.stage*35;save.coins+=prize;if(save.stage<10){$('log').textContent=`🏆 勝利！ +${prize}コイン獲得！ 次のステージ解放！`;save.stage++}else $('log').textContent=`👑 全10ステージ制覇！ +${prize}コイン！ 再挑戦も可能！`}else $('log').textContent='💀 敗北… パーツを強化して再挑戦！';persist();ui()}function update(dt){
 if(!active)return;
 for(const o of [p,e]){
  o.angle+=dt*(o===p?12:-13);
  o.boost=Math.max(0,o.boost-dt);o.jump=Math.max(0,(o.jump||0)-dt);o.jumpCD=Math.max(0,(o.jumpCD||0)-dt);o.shield=Math.max(0,o.shield-dt);
  o.hp-=dt*(1.2+100/(o.st+15));
 }
 // Constantly home toward the opposing top. Coordinates and velocities are in pixels/second.
 for(const [o,target] of [[p,e],[e,p]]){
  const dx=target.x-o.x,dy=target.y-o.y,dist=Math.hypot(dx,dy)||1;
  const speed=155+(o===e?save.stage*4:0);
  const desiredX=dx/dist*speed,desiredY=dy/dist*speed;
  const turn=Math.min(1,dt*3.6);
  o.vx=(o.vx||0)*(1-turn)+desiredX*turn;
  o.vy=(o.vy||0)*(1-turn)+desiredY*turn;
  o.x+=o.vx*dt;o.y+=o.vy*dt;
  // Keep both combatants within the visible oval.
  let ax=(o.x-360)/290,ay=(o.y-245)/177,r=Math.hypot(ax,ay);
  if(r>1){o.x=360+(o.x-360)/r;o.y=245+(o.y-245)/r;o.vx*=.2;o.vy*=.2}
 }
 cooldown=Math.max(0,cooldown-dt);
 const dx=e.x-p.x,dy=e.y-p.y,d=Math.hypot(dx,dy);
 if(d<83&&cooldown<=0){
  hit(p,e);hit(e,p);
  const nx=dx/(d||1),ny=dy/(d||1),midX=(p.x+e.x)/2,midY=(p.y+e.y)/2;
  p.x=midX-nx*52;p.y=midY-ny*52;e.x=midX+nx*52;e.y=midY+ny*52;
  p.vx=-nx*220;p.vy=-ny*220;e.vx=nx*220;e.vy=ny*220;
  cooldown=.72;
 }
 if(p.hp<=0||e.hp<=0)finish(e.hp<=0&&p.hp>0);
}
const spriteImages={};
for(const kind of ['b','w'])for(let i=0;i<5;i++){const im=new Image();im.src=`${kind}${i}_sprite.png`;spriteImages[kind+i]=im}
function drawTop(o,c=ctx){
 const v=o.visual||{shooter:'s0',body:'b0',weapon:'w0'};
 const bi=Number(v.body.slice(1))||0,wi=Number(v.weapon.slice(1))||0,si=Number(v.shooter.slice(1))||0;
 const lift=o.jump>0?Math.sin((.9-o.jump)/.9*Math.PI)*28:0;
 c.save();c.translate(o.x,o.y-lift);
 c.save();c.globalAlpha=.45;c.fillStyle='#020715';c.beginPath();c.ellipse(0,30+lift,54,13,0,0,Math.PI*2);c.fill();c.restore();
 // Rotate the entire assembled top: armor and weapon share the same center and angle.
 c.rotate(o.angle);c.shadowColor=['#42bfff','#ae69ff','#ffffff','#75efff','#ff6a23'][bi];c.shadowBlur=16;
 const body=spriteImages['b'+bi],weapon=spriteImages['w'+wi];
 if(body&&body.complete&&body.naturalWidth)c.drawImage(body,-56,-50,112,100);
 else{c.fillStyle='#2ba9ed';c.beginPath();c.arc(0,0,40,0,Math.PI*2);c.fill()}
 // Weapon sprite has transparent center, allowing the selected body to remain visible.
 if(weapon&&weapon.complete&&weapon.naturalWidth)c.drawImage(weapon,-65,-58,130,116);
 const core=['#28baff','#17dc7e','#e8efff','#ffdd2d','#ff5353'][si];
 c.shadowBlur=10;c.fillStyle=core;c.strokeStyle='#e6f9ff';c.lineWidth=2;
 c.beginPath();c.arc(0,0,9,0,Math.PI*2);c.fill();c.stroke();
 c.fillStyle='#102037';c.beginPath();c.arc(0,0,4,0,Math.PI*2);c.fill();
 c.restore();
 if(o.shield>0){c.strokeStyle='#7bf7ff';c.lineWidth=4;c.beginPath();c.arc(o.x,o.y-lift,57,0,Math.PI*2);c.stroke()}
 if(lift){c.strokeStyle='#b4efff';c.lineWidth=3;c.beginPath();c.arc(o.x,o.y-lift,54,0,Math.PI*2);c.stroke()}
}

const shortNames={shooter:'シューター',body:'ボディ',weapon:'ウエポン'};
function partDetails(t,x){return t==='shooter'?`❤️ 体力 ${x.hp}　🌀 安定 ${x.st}`:t==='body'?`🛡 守備 ${x.def}<br>✨ ${skillNames[x.skill]}`:`⚔️ 攻撃 ${x.atk}　⭐ 器用 ${x.dex}`}
function renderPartCards(){document.querySelectorAll('#customTabs button').forEach(b=>b.classList.toggle('selected',b.dataset.part===currentPart));$('partGrid').innerHTML=parts[currentPart].map(x=>{let own=save.owned.includes(x.id),eq=save.chosen[currentPart]===x.id;return `<div class="partCard ${eq?'equipped':''} ${own?'':'locked'}"><img src="${x.id}_art.webp" alt="${x.name}"><div class="name">${x.name}</div><div class="detail">${partDetails(currentPart,x)}</div><button data-equip="${x.id}" ${!own||active?'disabled':''}>${eq?'✓ 装備中':own?'装備する':'🔒 ショップで購入'}</button></div>`}).join('');document.querySelectorAll('[data-equip]').forEach(btn=>btn.onclick=()=>{if(active)return;save.chosen[currentPart]=btn.dataset.equip;persist();ui()})}
document.querySelectorAll('#customTabs button').forEach(b=>b.onclick=()=>{currentPart=b.dataset.part;renderPartCards()});
const priorUI=ui;ui=function(){priorUI();renderPartCards();$('shop').innerHTML=Object.keys(parts).flatMap(t=>parts[t].filter(x=>x.cost).map(x=>`<div class="item"><img src="${x.id}_art.webp" alt="${x.name}"><b>${x.name}</b><div class="muted">${partDetails(t,x)}</div><button data-id="${x.id}" data-type="${t}" ${active||save.owned.includes(x.id)||save.coins<x.cost?'disabled':''}>${save.owned.includes(x.id)?'購入済み':'🪙 '+x.cost}</button></div>`)).join('');document.querySelectorAll('#shop [data-id]').forEach(btn=>btn.onclick=()=>{let x=parts[btn.dataset.type].find(x=>x.id===btn.dataset.id);if(active||save.coins<x.cost)return;save.coins-=x.cost;save.owned.push(x.id);save.chosen[btn.dataset.type]=x.id;persist();ui()})};

function render(t){
 const dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);
 const W=720,H=490,time=t*.001;ctx.clearRect(0,0,W,H);
 const bg=ctx.createRadialGradient(360,245,15,360,245,450);bg.addColorStop(0,'#24507a');bg.addColorStop(.55,'#0b2044');bg.addColorStop(1,'#020713');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 // Spectator walls and luminous sci-fi arena architecture.
 for(let i=0;i<12;i++){let x=i*65;ctx.fillStyle=i%2?'#102949':'#0a1d37';ctx.fillRect(x,0,62,68);ctx.fillStyle=i%2?'#1b83bd':'#ff486a';ctx.globalAlpha=.65;ctx.fillRect(x+6,63,48,4);ctx.globalAlpha=1}
 ctx.save();ctx.translate(360,257);ctx.scale(1,.65);
 for(let j=0;j<4;j++){let r=330-j*27;ctx.beginPath();ctx.ellipse(0,0,r,r,0,0,Math.PI*2);ctx.strokeStyle=['#28d7ff','#14659d','#24557d','#1d426a'][j];ctx.shadowColor=j===0?'#1de7ff':'transparent';ctx.shadowBlur=j===0?22:0;ctx.lineWidth=j===0?10:3;ctx.stroke()}
 ctx.shadowBlur=0;
 for(let j=0;j<16;j++){let a=j*Math.PI/8;ctx.beginPath();ctx.moveTo(Math.cos(a)*80,Math.sin(a)*80);ctx.lineTo(Math.cos(a)*310,Math.sin(a)*310);ctx.strokeStyle='#1e4266';ctx.lineWidth=2;ctx.stroke()}
 for(let j=0;j<3;j++){ctx.beginPath();ctx.arc(0,0,95+j*58,0,Math.PI*2);ctx.strokeStyle='rgba(67,159,222,.18)';ctx.lineWidth=2;ctx.stroke()}
 ctx.restore();
 for(let i=0;i<26;i++){let a=i*2.399+time*.08,r=120+(i*37)%205,x=360+Math.cos(a)*r,y=245+Math.sin(a)*r*.64;ctx.fillStyle=i%4?'#187cbb':'#ff6c4d';ctx.globalAlpha=.3+Math.sin(time*2+i)*.2;ctx.fillRect(x,y,3,3)}ctx.globalAlpha=1;
 if(!p){p=build();e=foe()}
 for(const [o,color] of [[p,'#19d8ff'],[e,'#ff415e']]){
  ctx.save();ctx.globalAlpha=.35;ctx.fillStyle=color;ctx.shadowColor=color;ctx.shadowBlur=16;ctx.beginPath();ctx.ellipse(o.x,o.y+39,54,15,0,0,Math.PI*2);ctx.fill();ctx.restore();
  if(active){ctx.save();ctx.strokeStyle=color;ctx.globalAlpha=.38;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x-o.vx*.12,o.y-o.vy*.12);ctx.lineTo(o.x-o.vx*.38,o.y-o.vy*.38);ctx.stroke();ctx.restore()}
 }
 drawTop(p);drawTop(e);
 particles.forEach(q=>{ctx.globalAlpha=q.life/25;ctx.shadowBlur=8;ctx.shadowColor=q.color;ctx.fillStyle=q.color;ctx.fillRect(q.x,q.y,5,5);q.x+=q.vx;q.y+=q.vy;q.life--});ctx.shadowBlur=0;ctx.globalAlpha=1;particles=particles.filter(q=>q.life>0);
 if(active){$('php').style.width=Math.max(0,p.hp/p.max*100)+'%';$('ehp').style.width=Math.max(0,e.hp/e.max*100)+'%';$('ptxt').textContent=Math.ceil(Math.max(0,p.hp))+' / '+p.max;$('etxt').textContent=Math.ceil(Math.max(0,e.hp))+' / '+e.max;$('skill').disabled=p.skill==='none'||p.charge<100;$('skill').textContent=p.skill==='none'?'スキルなし':'🔥 スキル '+Math.floor(p.charge)+'%';$('jump').disabled=p.jumpCD>0||p.hp<=13;$('jump').textContent=p.jumpCD>0?'🪽 ジャンプ '+p.jumpCD.toFixed(1)+'秒':'🪽 ジャンプ HP-12'}
 requestAnimationFrame(render)
}ui();requestAnimationFrame(render);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.149.0/three.min.js"></script>
<script>
(function(){
const screen=document.getElementById('arena3d'),badge=document.getElementById('arenaBadge');
if(!window.THREE){badge.textContent='3Dの読み込みに失敗しました。通信環境を確認してください';document.getElementById('arena').style.display='block';return}
const T=THREE, scene=new T.Scene();scene.background=new T.Color(0x020716);scene.fog=new T.FogExp2(0x050b1d,.038);
const camera=new T.PerspectiveCamera(48,1,.1,150);camera.position.set(0,16,21);camera.lookAt(0,0,0);
const renderer=new T.WebGLRenderer({canvas:screen,antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.6;
scene.add(new T.HemisphereLight(0x8ccaff,0x151020,2.0));
function light(col,x,y,z,power){let l=new T.PointLight(col,power,22);l.position.set(x,y,z);scene.add(l)}light(0x23aaff,-8,9,0,130);light(0xff4d35,8,8,-1,100);light(0xffffff,0,13,5,100);
const mat=(c,metal=.75,rough=.27)=>new T.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,side:T.DoubleSide});
const blue=mat(0x0871d2),silver=mat(0xc8e4ff),dark=mat(0x10172b),gold=mat(0xf2b943),red=mat(0xd82434),black=mat(0x101018);
function mesh(geo,material,parent,x=0,y=0,z=0){const m=new T.Mesh(geo,material);m.position.set(x,y,z);parent.add(m);return m}
const floor=mesh(new T.CylinderGeometry(10.6,11.1,.65,96),mat(0x101e35,.65,.25),scene,0,-.65,0);
const disk=mesh(new T.CylinderGeometry(9.5,9.5,.06,96),mat(0x132d4c,.8,.21),scene,0,-.28,0);
const rings=[];for(let r of [3,5.8,8.7,9.65]){let g=new T.TorusGeometry(r,.045,8,128),m=new T.MeshBasicMaterial({color:r>9?0x23dfff:0x1763b3});let ring=mesh(g,m,scene,0,-.21,0);ring.rotation.x=Math.PI/2;rings.push(ring)}
for(let i=0;i<64;i++){let a=i*Math.PI/32;let block=mesh(new T.BoxGeometry(.8,1.5,.6),mat(i%4===0?0x214d8c:0x0c1831),scene,Math.cos(a)*11.4,.15,Math.sin(a)*11.4);block.rotation.y=-a;let lamp=mesh(new T.BoxGeometry(.45,.10,.12),new T.MeshBasicMaterial({color:i%2?0x158fff:0xff492c}),scene,Math.cos(a)*11.1,.65,Math.sin(a)*11.1);lamp.rotation.y=-a}
for(let i=0;i<14;i++){let a=i*Math.PI*2/14;let spot=mesh(new T.BoxGeometry(.6,.2,.6),new T.MeshBasicMaterial({color:i%2?0x4edaff:0xffad57}),scene,Math.cos(a)*11.5,2.2,Math.sin(a)*11.5)}
const models=[null,null];const palettes={b0:[0x158fff,0xc7eaff],b1:[0x7c22cf,0xb777ff],b2:[0xa9c3df,0xffd978],b3:[0x1daaff,0x9df5ff],b4:[0xe52e14,0xffad24]};
function makeTop(v,enemy){const group=new T.Group(),rotor=new T.Group();group.add(rotor);
const bi=v.body||'b0',wi=v.weapon||'w0',si=v.shooter||'s0';let colors=palettes[bi]||palettes.b0;
let primary=mat(colors[0]),accent=mat(colors[1]),edge=mat(enemy?0xff3545:0x29ccff);
mesh(new T.CylinderGeometry(1.02,.73,.5,32),dark,rotor,0,.33,0);
mesh(new T.CylinderGeometry(.85,1.02,.19,32),primary,rotor,0,.68,0);
mesh(new T.TorusGeometry(.93,.12,9,32),silver,rotor,0,.77,0).rotation.x=Math.PI/2;
mesh(new T.CylinderGeometry(.56,.68,.16,12),accent,rotor,0,.85,0);
for(let i=0;i<10;i++){let a=i*Math.PI/5;let tooth=mesh(new T.BoxGeometry(.38,.23,.8),i%2?primary:accent,rotor,Math.sin(a)*.79,.78,Math.cos(a)*.79);tooth.rotation.y=a}
let wm=wi==='w1'?mat(0xff531a):wi==='w2'?mat(0x4fc53a):wi==='w3'?mat(0xb7a38c):wi==='w4'?mat(0xb24aff):silver;
const count=wi==='w3'?8:wi==='w4'?9:12;
for(let i=0;i<count;i++){let a=i*Math.PI*2/count;let tooth=mesh(new T.BoxGeometry(.35,.23,wi==='w1'?.9:.7),wm,rotor,Math.sin(a)*1.25,.62,Math.cos(a)*1.25);tooth.rotation.y=a;tooth.rotation.z=wi==='w1'?.23:0;let tip=mesh(new T.ConeGeometry(wi==='w1'?.22:.15,.58,4),wm,rotor,Math.sin(a)*1.52,.66,Math.cos(a)*1.52);tip.rotation.z=Math.PI/2;tip.rotation.y=a}
mesh(new T.CylinderGeometry(.35,.38,.16,12),si==='s1'?mat(0x27d969):si==='s3'?gold:si==='s4'?red:si==='s2'?silver:edge,rotor,0,1.01,0);
mesh(new T.CylinderGeometry(.12,.17,.09,16),silver,rotor,0,1.12,0);
const aura=new T.Mesh(new T.TorusGeometry(1.68,.035,7,64),new T.MeshBasicMaterial({color:enemy?0xff3c35:wi==='w1'?0xff6b25:wi==='w4'?0xa755ff:0x19aaff,transparent:true,opacity:.7}));aura.rotation.x=Math.PI/2;aura.position.y=.19;group.add(aura);
const glow=new T.PointLight(enemy?0xff3020:0x008fff,3,4);glow.position.y=1;group.add(glow);
return {group,rotor,aura,visual:JSON.stringify(v),glow}}
function setModel(index,o){let visual=JSON.stringify(o.visual);if(models[index]&&models[index].visual===visual)return; if(models[index])scene.remove(models[index].group);models[index]=makeTop(o.visual,index===1);scene.add(models[index].group)}
const sparks=[];const sparkGeo=new T.SphereGeometry(.065,5,5);for(let i=0;i<36;i++){let m=mesh(sparkGeo,new T.MeshBasicMaterial({color:i%2?0xffc64e:0x6ddfff,transparent:true,opacity:0}),scene);sparks.push({m,life:0,vx:0,vy:0,vz:0})}let lastCollision=0,lastPos=null;
function boom(x,z){for(const s of sparks){s.life=.25+Math.random()*.55;s.m.position.set(x,1,z);s.vx=(Math.random()-.5)*15;s.vy=Math.random()*8;s.vz=(Math.random()-.5)*15;s.m.material.opacity=1}}
let previous=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-previous)/1000);previous=now;
const w=screen.clientWidth,h=screen.clientHeight;if(w&&h&&(screen.width!==Math.round(w*renderer.getPixelRatio())||screen.height!==Math.round(h*renderer.getPixelRatio()))){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
if(typeof p!=='undefined'&&p&&e){setModel(0,p);setModel(1,e);for(let i=0;i<2;i++){const o=i===0?p:e,m=models[i];m.group.position.set((o.x-360)/34,Math.max(0,o.jump||0)*1.8,(o.y-245)/34);m.rotor.rotation.y=-(o.angle||0)*1.6;m.rotor.rotation.z=Math.sin(now*.013+i)*.07;m.aura.rotation.z+=dt*2;m.aura.material.opacity=.45+Math.sin(now*.012)*.2}const dist=Math.hypot(p.x-e.x,p.y-e.y);if(active&&dist<110&&now-lastCollision>350){boom((p.x+e.x-720)/68,(p.y+e.y-490)/68);lastCollision=now}}
for(const s of sparks){if(s.life>0){s.life-=dt;s.m.position.x+=s.vx*dt;s.m.position.y+=s.vy*dt;s.m.position.z+=s.vz*dt;s.vy-=16*dt;s.m.material.opacity=Math.max(0,s.life*1.8)}}
camera.position.x=Math.sin(now*.00018)*1.3;camera.lookAt(0,.1,0);renderer.render(scene,camera)}requestAnimationFrame(animate);
})();
</script>
